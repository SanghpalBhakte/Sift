name: CI & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-check:
    name: Required Secrets Present
    runs-on: ubuntu-latest
    # Only run on push to main (PRs from forks won't have secrets)
    if: github.event_name == 'push'
    steps:
      - name: Verify required GitHub secrets are set
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          MISSING=()
          [ -z "$SUPABASE_URL" ]       && MISSING+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -z "$SUPABASE_ANON_KEY" ]  && MISSING+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -z "$VAPID_PUBLIC_KEY" ]   && MISSING+=("NEXT_PUBLIC_VAPID_PUBLIC_KEY")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠️  Warning: Missing GitHub Secrets: ${MISSING[*]}"
            echo "   Add them at: Settings → Secrets and variables → Actions"
            echo "   Deployments will still succeed with Vercel's own env vars,"
            echo "   but the secrets-check job advisory will remain until they are added."
          else
            echo "✅ All required secrets are present."
          fi
          # Never block CI — secrets are advisory only (Vercel manages production env vars)
          exit 0

  quality:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    env:
      # Stub values so tsc --noEmit and next lint do not crash on missing env
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'placeholder-vapid-key' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: quality

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'placeholder-vapid-key' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
