name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  check-deploy-secrets:
    name: Check Deployment Secrets
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}

    steps:
      - name: Verify Vercel Secrets Presence
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment credentials detected."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment credentials not configured in repository. Skipping deploy stage."
          fi

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [test, check-deploy-secrets]
    if: ${{ needs.test.result == 'success' && needs.check-deploy-secrets.outputs.can_deploy == 'true' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Initialize Diagnostic Log Files
        run: touch vercel-pull.log vercel-build.log vercel-deploy.log

      - name: Pre-Flight Credentials & Diagnostics
        run: |
          echo "=== Vercel Deployment Pre-Flight Check ==="
          echo "Target Git Ref: ${{ github.ref }}"
          echo "Event Trigger: ${{ github.event_name }}"
          echo "Vercel CLI Version: $(vercel --version)"
          
          FAIL=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing or empty."
            FAIL=1
          else
            echo "✓ VERCEL_TOKEN is populated (${#VERCEL_TOKEN} chars)"
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID secret is missing or empty."
            FAIL=1
          else
            echo "✓ VERCEL_ORG_ID is populated (${#VERCEL_ORG_ID} chars)"
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID secret is missing or empty."
            FAIL=1
          else
            echo "✓ VERCEL_PROJECT_ID is populated (${#VERCEL_PROJECT_ID} chars)"
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "Pre-flight validation failed. Please verify repository secrets in GitHub settings."
            exit 1
          fi

          echo "Authenticated Identity: $(vercel whoami --token=$VERCEL_TOKEN 2>&1)"
          echo "Pre-flight validation complete."

      # ------------------------------------------------------------------------
      # Preview Deployment (Pull Requests)
      # ------------------------------------------------------------------------
      - name: Pull Vercel Environment (Preview)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --debug 2>&1 | tee vercel-pull.log

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          vercel build --token=$VERCEL_TOKEN --debug 2>&1 | tee vercel-build.log

      - name: Deploy Preview to Vercel
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          vercel deploy --prebuilt --token=$VERCEL_TOKEN --logs --debug 2>&1 | tee vercel-deploy.log

      # ------------------------------------------------------------------------
      # Production Deployment (Push to Main)
      # ------------------------------------------------------------------------
      - name: Pull Vercel Environment (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN --debug 2>&1 | tee vercel-pull.log

      - name: Build Project Artifacts (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          vercel build --prod --token=$VERCEL_TOKEN --debug 2>&1 | tee vercel-build.log

      - name: Deploy Production to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --logs --debug 2>&1 | tee vercel-deploy.log

      # ------------------------------------------------------------------------
      # Upload Diagnostic Logs
      # ------------------------------------------------------------------------
      - name: Upload Vercel Deployment Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deployment-logs
          path: |
            vercel-pull.log
            vercel-build.log
            vercel-deploy.log
          if-no-files-found: error
